# The mootmaker release pipeline. See mootmaker/designs/archive/ci-cd-pipeline.md.
#
# Nothing here runs automatically. A merge to main in any component repo changes nothing until
# someone deliberately starts a release (Decision 1). The shape is:
#
#   compute-version -> build-{api,webapp,demo-data,android} -> tag -> deploy test
#                   -> smoke test (web and Android) -> deploy production
#                   -> smoke production (web and Android) -> record-outcome
#
# The Android app (mootmaker/designs/android-app.md, Q3-A) is a fourth component with nothing to
# deploy: build-android builds and signs its APK once, the smoke jobs install that APK, and
# record-outcome attaches it to the Release only when every stage passed. An APK can't be
# un-published from phones, so it is published last.
#
# Two properties are load-bearing and easy to break by rearranging jobs:
#
#   1. TAGS ARE PUSHED ONLY AFTER ALL FOUR BUILDS PASS (Decision 4), so a tag always names a
#      commit that was actually proven. A release that fails later simply never reuses its version
#      number - the next attempt computes a fresh one. Nothing is ever un-tagged.
#
#   2. record-outcome RUNS WITH if: always() AND BRANCHES ON THE TAG JOB'S OWN OUTPUT, never on
#      whether later jobs succeeded (Decision 5). A run can fail after tagging for reasons that
#      have nothing to do with whether the tags are real, and the failure mode this guards against
#      is tags existing on GitHub with nothing recording that they do.
#
# AWS access is via OIDC. Note the deploy role trusts this workflow at refs/heads/main, and that
# entry is what carries EVERY release: a reusable workflow called with `uses:` presents the
# CALLER's sub, so when a component's release-build.yml runs below, the token says
# mootmaker-release@refs/heads/main - not the component. The component refs/tags/v* entries exist
# only for standalone proving runs.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment.
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

# Queue overlapping triggers rather than cancelling. A human and an AI both starting a release, or
# a double-click, must not race on reading the current version, on tagging, or on deploying to the
# same standing environment. cancel-in-progress is deliberately false: killing a release mid
# `terraform apply` is a worse outcome than making the second trigger wait (Decision 1).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reads the current version from this repo's own GitHub Releases - not a version file, and not by
  # inspecting tags in one of the component repos, which would raise "which of the three do we
  # ask?" (Decision 4). Also pins each component's main SHA ONCE here, so every later stage builds
  # and tags the same commit even if something merges mid-release.
  compute-version:
    name: compute-version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
      # The tag rollback targets. Empty when this is the first release, which is the one case
      # rollback cannot help with - there is no known-good version to go back to.
      previous: ${{ steps.next.outputs.previous }}
      api-sha: ${{ steps.shas.outputs.api }}
      webapp-sha: ${{ steps.shas.outputs.webapp }}
      demo-data-sha: ${{ steps.shas.outputs.demo_data }}
      android-sha: ${{ steps.shas.outputs.android }}
    steps:
      - name: Compute the next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # No releases yet means this is the first one. Treat the implicit previous version as
          # 0.0.0, so the first patch release is 0.0.1 and the first minor is 0.1.0.
          # Two DIFFERENT questions, deliberately answered from different queries.
          #
          # 1. What number comes next? That must consider EVERY release, failed ones included -
          #    a failed attempt consumed its version and must never be reused (Decision 4).
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName \
            --jq '.[0].tagName // "v0.0.0"')"
          echo "Latest release (including failed attempts): ${latest}"

          # 2. What would rollback target? That must be the last release that actually REACHED
          #    production, which is not the same thing. record-outcome publishes a failed attempt
          #    as a prerelease, so excluding prereleases is what distinguishes them. Rolling back
          #    to a version that never deployed would restore something never known to work - the
          #    opposite of what Decision 10 relies on ("the previous version is known-good by
          #    construction: it was itself a release that reached production").
          #
          # Empty rather than v0.0.0 when nothing has ever succeeded, so rollback can tell
          # "nothing to go back to" from "go back to 0.0.0", which was never deployed either.
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-pre-releases \
            --json tagName --jq '.[0].tagName // ""')"
          echo "Last successful release (rollback target): ${previous:-<none>}"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

          current="${latest#v}"
          IFS=. read -r major minor patch <<< "${current}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unknown bump: $BUMP" >&2; exit 1 ;;
          esac

          version="${major}.${minor}.${patch}"
          echo "Releasing: v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pin each component's commit
        id: shas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for repo in mootmaker-api mootmaker-webapp mootmaker-demo-data mootmaker-android; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/commits/main" --jq .sha)"
            echo "${repo}: ${sha}"
            echo "${repo//mootmaker-/}=${sha}" | tr '-' '_' >> "$GITHUB_OUTPUT"
          done

  # Stage 1: build, unit test and acceptance test every component against its own fresh ephemeral
  # environment, in parallel. Each uploads the artifact that later stages promote unchanged - it is
  # never rebuilt per environment (Decision 8). `uses: ...@main` selects the workflow DEFINITION;
  # the ref input selects which COMMIT to build.
  build-api:
    name: build-api
    needs: compute-version
    permissions:
      id-token: write
      contents: read
    uses: geoffweatherall/mootmaker-api/.github/workflows/release-build.yml@main
    with:
      version: ${{ needs.compute-version.outputs.version }}
      ref: ${{ needs.compute-version.outputs.api-sha }}

  # Parallel with build-api and build-demo-data (mootmaker#75, mootmaker-release#11). Decision 7
  # gives each component its own fresh ephemeral environment, and mootmaker-webapp and
  # mootmaker-demo-data each deploy mootmaker-api into theirs - so this runs THREE simultaneous
  # mootmaker-api deployments, each publishing SnapStart versions.
  #
  # That is how the v0.0.2 release failed: all three builds died within seconds of each other on a
  # published version stuck in 'Failed'/'FunctionError' (mootmaker#41), and the builds were
  # serialised in response. The suspected cause was the account's Lambda concurrency quota - 10
  # then, 1,000 since 2026-09-07 (mootmaker#72) - but that was never proven: FunctionError says
  # init failed, not that it was throttled.
  #
  # So this is the experiment that settles #41. If a release fails with all three builds dying
  # together on a Failed/FunctionError version, capture the function's StateReason
  # (aws lambda get-function-configuration --qualifier <version>) before tearing anything down,
  # record it on #41, and restore the old chain: build-webapp needs build-api, build-demo-data needs
  # build-webapp.
  build-webapp:
    name: build-webapp
    needs: compute-version
    permissions:
      id-token: write
      contents: read
    uses: geoffweatherall/mootmaker-webapp/.github/workflows/release-build.yml@main
    with:
      version: ${{ needs.compute-version.outputs.version }}
      ref: ${{ needs.compute-version.outputs.webapp-sha }}

  # Parallel too - see the comment above build-webapp.
  build-demo-data:
    name: build-demo-data
    needs: compute-version
    permissions:
      id-token: write
      contents: read
    uses: geoffweatherall/mootmaker-demo-data/.github/workflows/release-build.yml@main
    with:
      version: ${{ needs.compute-version.outputs.version }}
      ref: ${{ needs.compute-version.outputs.demo-data-sha }}

  # The Android app: builds and signs the release APK once, runs the app's acceptance suite against
  # that APK in its own rel-and ephemeral environment, and uploads it (android-app.md Q3-A). The
  # signing key lives on THIS repository only, and a called workflow sees only its caller's
  # secrets, so they are passed explicitly. No secret means the build fails rather than signing
  # with anything else.
  build-android:
    name: build-android
    needs: compute-version
    permissions:
      id-token: write
      contents: read
    uses: geoffweatherall/mootmaker-android/.github/workflows/release-build.yml@main
    with:
      version: ${{ needs.compute-version.outputs.version }}
      ref: ${{ needs.compute-version.outputs.android-sha }}
      signing: release
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # Only reached when all four builds are green, which is the whole point: a tag marks a commit
  # that was proven, never one that failed (Decision 4). This is the one place a cross-repo write
  # is unavoidable, and the only place the PAT is used (Decision 3).
  tag:
    name: tag
    needs: [compute-version, build-api, build-webapp, build-demo-data, build-android]
    runs-on: ubuntu-24.04
    outputs:
      # record-outcome branches on this rather than on later jobs' success. Set the moment the tags
      # land, so "were tags pushed?" is answerable even if a later stage fails outright.
      pushed: ${{ steps.push.outputs.pushed }}
      version: ${{ needs.compute-version.outputs.version }}
    steps:
      - name: Push the version tag to every repository
        id: push
        env:
          # contents: write, scoped to exactly these five repositories and nothing else. The one
          # accepted long-lived-credential exception in this design (Decision 3) - its value never
          # passes through a session or a log.
          GH_TOKEN: ${{ secrets.RELEASE_TAG_PAT }}
          VERSION: ${{ needs.compute-version.outputs.version }}
          API_SHA: ${{ needs.compute-version.outputs.api-sha }}
          WEBAPP_SHA: ${{ needs.compute-version.outputs.webapp-sha }}
          DEMO_DATA_SHA: ${{ needs.compute-version.outputs.demo-data-sha }}
          ANDROID_SHA: ${{ needs.compute-version.outputs.android-sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          # Each component is tagged at the exact commit its build reported, not at whatever main
          # points to now - a merge landing mid-release must not be able to acquire this tag.
          tag_repo() {
            local repo="$1" sha="$2"
            echo "Tagging ${repo} at ${sha} as ${tag}"
            gh api --method POST "repos/${GITHUB_REPOSITORY_OWNER}/${repo}/git/refs" \
              -f "ref=refs/tags/${tag}" -f "sha=${sha}" > /dev/null
          }

          tag_repo mootmaker-api "${API_SHA}"
          tag_repo mootmaker-webapp "${WEBAPP_SHA}"
          tag_repo mootmaker-demo-data "${DEMO_DATA_SHA}"
          tag_repo mootmaker-android "${ANDROID_SHA}"
          # This repo has no deployable artifact either, but it is where the Release is published,
          # so keeping its tag and that Release together is simpler than splitting them.
          tag_repo mootmaker-release "${GITHUB_SHA}"

          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # Promotes the EXACT artifacts Stage 1 produced - downloaded, not rebuilt (Decision 8). Each
  # component's own deploy.sh does the work, with --skip-build so the jar/bundle already on disk is
  # what ships. Reusing those scripts rather than inlining terraform here keeps one source of truth
  # for environment validation, backend keys and TF_DATA_DIR isolation.
  #
  # This job is also what STANDS TEST UP the first time. `terraform apply` is create-or-update, so
  # there is no separate bootstrap step - and deliberately so: Decision 6's mitigation is that
  # test's state changes only through this pipeline, never by ad hoc interactive use. Creating it
  # by hand with deploy.sh would break that property on day one.
  deploy-test:
    name: deploy-test
    needs: [compute-version, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      # This repo, for scripts/ship-to-cloudwatch.sh. The smoke jobs already check it out for the
      # suites themselves; the deploy jobs need it only for the shipping script.
      - uses: actions/checkout@v5
        with:
          path: mootmaker-release
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-api
          ref: ${{ needs.compute-version.outputs.api-sha }}
          path: mootmaker-api

      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-webapp
          ref: ${{ needs.compute-version.outputs.webapp-sha }}
          path: mootmaker-webapp

      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-demo-data
          ref: ${{ needs.compute-version.outputs.demo-data-sha }}
          path: mootmaker-demo-data

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # The webapp's deploy.sh runs its schema-compatibility check with jq and curl, and writes
      # env-config.js - no build, but it still needs node available for nothing more than npm's
      # presence checks in the scripts it calls.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1

      # Downloaded to exactly where each component's Terraform already looks, so deploy.sh
      # --skip-build finds them without any path plumbing.
      - uses: actions/download-artifact@v7
        with:
          name: mootmaker-api-${{ needs.compute-version.outputs.version }}
          path: mootmaker-api/impl/target

      - uses: actions/download-artifact@v7
        with:
          name: mootmaker-demo-data-${{ needs.compute-version.outputs.version }}
          path: mootmaker-demo-data/impl/target

      - uses: actions/download-artifact@v7
        with:
          name: mootmaker-webapp-${{ needs.compute-version.outputs.version }}
          path: mootmaker-webapp/webapp/dist

      # Order matters and is not arbitrary. mootmaker-api's Terraform creates the SSM parameters
      # demo-data reads at runtime and the Cognito/AppSync outputs the webapp's deploy reads, so it
      # goes first. demo-data last, because seeding it needs the API live.
      # `set -o pipefail` is load-bearing on every one of these. GitHub runs steps with `bash -e`
      # but NOT pipefail, so `./deploy.sh | tee` would report the exit code of tee - always 0 -
      # and a failed deploy would sail through as success.
      - name: Deploy mootmaker-api to test
        working-directory: mootmaker-api
        run: |
          set -o pipefail
          ./deploy.sh test --skip-build 2>&1 | tee "$RUNNER_TEMP/deploy-test-api.log"

      - name: Deploy mootmaker-webapp to test
        working-directory: mootmaker-webapp
        run: |
          set -o pipefail
          ./deploy.sh test --skip-build 2>&1 | tee "$RUNNER_TEMP/deploy-test-webapp.log"

      - name: Deploy mootmaker-demo-data to test
        working-directory: mootmaker-demo-data
        run: |
          set -o pipefail
          ./deploy.sh test --skip-build 2>&1 | tee "$RUNNER_TEMP/deploy-test-demo-data.log"

      # NB-2. Deploying demo-data populates nothing - the Lambda only runs when invoked - so the
      # release seeds explicitly rather than waiting for the daily schedule. Without this, the
      # smoke test's "existing demo data reads back" checks would fail against a freshly created
      # test environment.
      #
      # --cli-read-timeout clears the function's own 900s ceiling. The CLI's 60s default would
      # report a false failure on a full seed while the Lambda ran on regardless - the same trap
      # that made demo-data's acceptance suite read a silent retry (demo-data#16).
      - name: Seed test with demo data
        run: |
          aws lambda invoke \
            --function-name test-mootmaker-demo-data \
            --cli-read-timeout 900 \
            --payload '{}' \
            /dev/stdout

      # Decision 11: ship after a version is tagged, which every stage from here on is. if:
      # always() so a FAILED deploy ships too - that is the output most worth having durably.
      # ship-to-cloudwatch.sh always exits 0, so a logging hiccup cannot fail the release.
      - name: Ship deploy-test output to CloudWatch
        if: always()
        run: |
          for c in api webapp demo-data; do
            mootmaker-release/scripts/ship-to-cloudwatch.sh \
              "${{ needs.compute-version.outputs.version }}" \
              deploy-test "mootmaker-$c" test "${{ job.status }}" \
              "$RUNNER_TEMP/deploy-test-$c.log"
          done

  # A failure here STOPS the release. test is deliberately NOT rolled back, reset or torn down -
  # that would destroy the evidence the environment exists to preserve (Decision 6a). The
  # consequence is accepted knowingly: the next attempt's deploy-to-test may fail again, loudly,
  # until whatever is wrong is fixed by hand.
  smoke-test-test:
    name: smoke-test-test
    needs: [compute-version, deploy-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: mootmaker-release

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mootmaker-release/package-lock.json

      # smoke/run.sh reads its configuration from SSM Parameter Store (mootmaker-api#94) and the
      # mutating suite polls SQS for real verification emails - both of which need AWS credentials. The job declared id-token: write
      # but never exchanged it, so run.sh failed immediately with "No valid credential sources
      # found". The deploy jobs had this step; the smoke jobs were written from their shape and
      # dropped it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1

      - name: Install smoke-test dependencies
        working-directory: mootmaker-release
        run: npm ci

      # Both smoke projects pin channel: 'chrome', so this installs real Google Chrome rather than
      # the bundled chromium build.
      - name: Install Playwright browser
        working-directory: mootmaker-release
        run: npx playwright install --with-deps chrome

      # The mutating suite: real signup through SES/SNS/SQS, sign in, create a meeting, read demo
      # data, reset the password, delete the account. run.sh refuses this stage against production.
      - name: Smoke test the test environment
        working-directory: mootmaker-release
        env:
          CI: 'true'
        run: |
          set -o pipefail
          ./smoke/run.sh test test 2>&1 | tee "$RUNNER_TEMP/smoke-test.log"

      # Playwright's JSON reporter output (Decision 9's `reporter: 'json'` under CI) - test names,
      # pass/fail, timing, error text. Never trace/video/screenshot: those are binary, run to
      # hundreds of MB, and PutLogEvents caps one event at 256KB regardless. A failed smoke test
      # needing a screenshot is an Actions artifact, a separate mechanism entirely.
      - name: Ship smoke-test-test output to CloudWatch
        if: always()
        run: |
          mootmaker-release/scripts/ship-to-cloudwatch.sh \
            "${{ needs.compute-version.outputs.version }}" \
            smoke-test-test mootmaker-release test "${{ job.status }}" \
            "$RUNNER_TEMP/smoke-test.log"


      # Decision 9 deliberately turns trace/video/screenshot off to keep the release's log volume
      # small, and that stands - but with all of them off a smoke failure during a release is
      # undiagnosable, which was the position after run 33836110034. Playwright still writes a
      # small error-context.md page snapshot per failure; uploading just that keeps the artifact
      # tiny (kilobytes, not the hundreds of megabytes a full trace costs) while making a failure
      # explicable without re-running anything.
      - name: Upload smoke failure context
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-test-failure-context
          path: mootmaker-release/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

  # The Android release APK from build-android, on an emulator, pointed at test: the read-only demo
  # sign-in, then the home agenda must render (mootmaker-android's smoke/demo-sign-in.yaml, run by
  # Maestro). Production waits for it, like the web smoke test.
  smoke-android-test:
    name: smoke-android-test
    needs: [compute-version, build-android, deploy-test]
    uses: geoffweatherall/mootmaker-android/.github/workflows/smoke.yml@main
    with:
      artifact-name: ${{ needs.build-android.outputs.artifact-name }}
      environment: test
      ref: ${{ needs.compute-version.outputs.android-sha }}

  # Only reached when test's smoke test passed. Identical in shape to deploy-test, promoting the
  # SAME artifacts again - the third deployment of one build, never a rebuild (Decision 8).
  deploy-production:
    name: deploy-production
    needs: [compute-version, smoke-test-test, smoke-android-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      # This repo, for scripts/ship-to-cloudwatch.sh. The smoke jobs already check it out for the
      # suites themselves; the deploy jobs need it only for the shipping script.
      - uses: actions/checkout@v5
        with:
          path: mootmaker-release
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-api
          ref: ${{ needs.compute-version.outputs.api-sha }}
          path: mootmaker-api

      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-webapp
          ref: ${{ needs.compute-version.outputs.webapp-sha }}
          path: mootmaker-webapp

      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-demo-data
          ref: ${{ needs.compute-version.outputs.demo-data-sha }}
          path: mootmaker-demo-data

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1

      - uses: actions/download-artifact@v7
        with:
          name: mootmaker-api-${{ needs.compute-version.outputs.version }}
          path: mootmaker-api/impl/target

      - uses: actions/download-artifact@v7
        with:
          name: mootmaker-demo-data-${{ needs.compute-version.outputs.version }}
          path: mootmaker-demo-data/impl/target

      - uses: actions/download-artifact@v7
        with:
          name: mootmaker-webapp-${{ needs.compute-version.outputs.version }}
          path: mootmaker-webapp/webapp/dist

      # set -o pipefail on each: GitHub runs steps with `bash -e` but NOT pipefail, so piping to
      # tee would report tee's exit code and a failed production deploy would pass silently.
      - name: Deploy mootmaker-api to production
        working-directory: mootmaker-api
        run: |
          set -o pipefail
          ./deploy.sh production --skip-build 2>&1 | tee "$RUNNER_TEMP/deploy-production-api.log"

      - name: Deploy mootmaker-webapp to production
        working-directory: mootmaker-webapp
        run: |
          set -o pipefail
          ./deploy.sh production --skip-build 2>&1 | tee "$RUNNER_TEMP/deploy-production-webapp.log"

      - name: Deploy mootmaker-demo-data to production
        working-directory: mootmaker-demo-data
        run: |
          set -o pipefail
          ./deploy.sh production --skip-build 2>&1 | tee "$RUNNER_TEMP/deploy-production-demo-data.log"

      - name: Ship deploy-production output to CloudWatch
        if: always()
        run: |
          for c in api webapp demo-data; do
            mootmaker-release/scripts/ship-to-cloudwatch.sh \
              "${{ needs.compute-version.outputs.version }}" \
              deploy-production "mootmaker-$c" production "${{ job.status }}" \
              "$RUNNER_TEMP/deploy-production-$c.log"
          done

      # NB-3. Seeds production, mirroring NB-2 for test. This used to say production was
      # deliberately NOT seeded, because demo-data runs there daily and its concerns are
      # idempotent. That reasoning holds for a normal release and fails for a rebuild: after a
      # destroy there is nothing for idempotence to be idempotent OVER, so v2.0.0 left the public
      # demo with zero rooms until the 06:00 UTC schedule fired hours later - and the production
      # smoke passed over it regardless. See mootmaker-release#42.
      #
      # Seeding is not "a write the release does not need to make": demo content IS the product
      # for a demo system, so a release that cannot produce it has not succeeded.
      #
      # Placement matters. This sits inside deploy-production, BEFORE smoke-test-production, and
      # rollback-production fires only on `needs.smoke-test-production.result == 'failure'`. So a
      # seeding failure stops the release with smoke skipped, and does NOT roll production back -
      # reverting a good deploy because demo content failed to generate is exactly mootmaker#46's
      # "rollback fires where it cannot help".
      #
      # --cli-read-timeout clears the function's own 900s ceiling, as in NB-2. The CLI's 60s
      # default would report a false failure on a full seed while the Lambda ran on regardless.
      - name: Seed production with demo data
        run: |
          aws lambda invoke \
            --function-name production-mootmaker-demo-data \
            --cli-read-timeout 900 \
            --payload '{}' \
            /dev/stdout

  # Strictly read-only (Decision 9). Signs in as the published demo user, navigates, confirms reads
  # display. No signup, no deletion, no password reset, no meeting creation - production takes no
  # writes from this layer at all, which is why there is no stray-data accumulation to manage.
  smoke-test-production:
    name: smoke-test-production
    needs: [compute-version, deploy-production]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: mootmaker-release

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mootmaker-release/package-lock.json

      # smoke/run.sh reads its configuration from SSM Parameter Store (mootmaker-api#94) and the
      # mutating suite polls SQS for real verification emails - both of which need AWS credentials. The job declared id-token: write
      # but never exchanged it, so run.sh failed immediately with "No valid credential sources
      # found". The deploy jobs had this step; the smoke jobs were written from their shape and
      # dropped it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1

      - name: Install smoke-test dependencies
        working-directory: mootmaker-release
        run: npm ci

      - name: Install Playwright browser
        working-directory: mootmaker-release
        run: npx playwright install --with-deps chrome

      - name: Smoke test production
        working-directory: mootmaker-release
        env:
          CI: 'true'
        run: |
          set -o pipefail
          ./smoke/run.sh production production 2>&1 | tee "$RUNNER_TEMP/smoke-production.log"

      # Playwright's JSON reporter output (Decision 9's `reporter: 'json'` under CI) - test names,
      # pass/fail, timing, error text. Never trace/video/screenshot: those are binary, run to
      # hundreds of MB, and PutLogEvents caps one event at 256KB regardless. A failed smoke test
      # needing a screenshot is an Actions artifact, a separate mechanism entirely.
      - name: Ship smoke-test-production output to CloudWatch
        if: always()
        run: |
          mootmaker-release/scripts/ship-to-cloudwatch.sh \
            "${{ needs.compute-version.outputs.version }}" \
            smoke-test-production mootmaker-release production "${{ job.status }}" \
            "$RUNNER_TEMP/smoke-production.log"


      # See the equivalent step in smoke-test-test for why this exists despite Decision 9's
      # artifacts-off stance.
      - name: Upload smoke failure context
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-production-failure-context
          path: mootmaker-release/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

  # Decision 10. test passing while production fails implies something environment-specific to
  # production - a data shape, a config difference, a race - rather than a code defect test should
  # have caught. That is exactly the case an automatic revert is safe for, because the previous
  # version is known-good by construction: it was itself a release that reached production.
  #
  # Rollback REBUILDS from the previous tag rather than promoting its stored artifacts. That is a
  # deliberate departure from build-once: Actions artifacts expire (30 days here), so a rollback
  # that depended on them would work until the day it was most needed. A tag is permanent, and the
  # design's own wording is "re-running the deploy step against the previous release's tag".
  #
  # The masking risk - an automatic redeploy hiding a data-shape problem that old code does not
  # actually fix - is accepted knowingly (OQ-2). It is never silent: record-outcome reports that a
  # rollback happened.
  rollback-production:
    name: rollback-production
    needs: [compute-version, deploy-production, smoke-test-production]
    if: failure() && needs.smoke-test-production.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      # This repo, for scripts/ship-to-cloudwatch.sh. The smoke jobs already check it out for the
      # suites themselves; the deploy jobs need it only for the shipping script.
      - uses: actions/checkout@v5
        with:
          path: mootmaker-release
      - name: Refuse to roll back with no previous release
        if: needs.compute-version.outputs.previous == ''
        run: |
          echo "production's smoke test failed, but there is no previous release to roll back to." >&2
          echo "production is left as deployed and needs manual attention." >&2
          exit 1

      # The previous release's tag exists in every component repo, pushed by that release's own
      # tag job - so one tag name resolves the whole set.
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-api
          ref: ${{ needs.compute-version.outputs.previous }}
          path: mootmaker-api

      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-webapp
          ref: ${{ needs.compute-version.outputs.previous }}
          path: mootmaker-webapp

      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-demo-data
          ref: ${{ needs.compute-version.outputs.previous }}
          path: mootmaker-demo-data

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1

      # No --skip-build: these rebuild from the tagged source, for the artifact-expiry reason above.
      - name: Redeploy the previous mootmaker-api
        working-directory: mootmaker-api
        run: |
          set -o pipefail
          ./deploy.sh production 2>&1 | tee "$RUNNER_TEMP/rollback-api.log"

      - name: Redeploy the previous mootmaker-webapp
        working-directory: mootmaker-webapp
        run: |
          set -o pipefail
          ./deploy.sh production 2>&1 | tee "$RUNNER_TEMP/rollback-webapp.log"

      - name: Redeploy the previous mootmaker-demo-data
        working-directory: mootmaker-demo-data
        run: |
          set -o pipefail
          ./deploy.sh production 2>&1 | tee "$RUNNER_TEMP/rollback-demo-data.log"

      # Tagged with the version being ROLLED BACK TO, not the failed one - the question this
      # answers later is "what happened when we reverted to X", and X is what production ended up
      # running.
      - name: Ship rollback output to CloudWatch
        if: always()
        run: |
          for c in api webapp demo-data; do
            mootmaker-release/scripts/ship-to-cloudwatch.sh \
              "${{ needs.compute-version.outputs.previous }}" \
              rollback-production "mootmaker-$c" production "${{ job.status }}" \
              "$RUNNER_TEMP/rollback-$c.log"
          done

  # Re-runs the read-only suite against the rolled-back production. If THIS fails, production is
  # broken in a way redeploying old code did not fix - which is the masking scenario made visible
  # rather than hidden.
  smoke-test-rollback:
    name: smoke-test-rollback
    needs: [compute-version, rollback-production]
    if: always() && needs.rollback-production.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      # Pipeline plumbing (ship-to-cloudwatch.sh) comes from the caller's ref, like every other job.
      - uses: actions/checkout@v5
        with:
          path: mootmaker-release

      # The SMOKE SUITE comes from the previous release's tag, matching the application it is about
      # to test (mootmaker-release#23). Run from main, a release that also advanced the suite - a new
      # assertion, a check for a feature only the new version has - would fail the rolled-back app
      # for behaviour it never had, and the release record would report that rollback did not
      # recover production when it did. The previous tag's suite is the one that was proven against
      # that application. mootmaker-release is tagged by every release, so the ref always exists
      # here: rollback-production has already refused to run without a previous release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.compute-version.outputs.previous }}
          path: mootmaker-release-previous

      # Only for the transitional install step below - see its comment.
      - uses: actions/checkout@v5
        with:
          repository: geoffweatherall/mootmaker-webapp
          ref: ${{ needs.compute-version.outputs.previous }}
          path: mootmaker-webapp

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mootmaker-release-previous/package-lock.json

      # smoke/run.sh reads its configuration from SSM Parameter Store (mootmaker-api#94) and the
      # mutating suite polls SQS for real verification emails - both of which need AWS credentials. The job declared id-token: write
      # but never exchanged it, so run.sh failed immediately with "No valid credential sources
      # found". The deploy jobs had this step; the smoke jobs were written from their shape and
      # dropped it.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::431071856068:role/mootmaker-release-github-actions-deploy
          aws-region: us-east-1

      # TRANSITIONAL (mootmaker-release#5). The smoke suite runs from the PREVIOUS release's tag, and
      # tags before the email client moved to the mootmaker-email-testing package import it from
      # mootmaker-webapp/support/ instead. Node resolves an imported file's dependencies relative to
      # ITS OWN location, so that copy needs mootmaker-webapp/node_modules installed. Skipped once
      # the previous tag no longer imports from the webapp - after which this step, the webapp
      # checkout above, and smoke/run.sh's sibling check at that tag are all dead and can go.
      - name: Install the webapp's runtime dependencies, if the previous smoke suite still imports them
        run: |
          if grep -rqs "mootmaker-webapp/support/" mootmaker-release-previous/smoke; then
            (cd mootmaker-webapp && npm ci --omit=dev)
          else
            echo "Previous smoke suite uses the mootmaker-email-testing package - nothing to install."
          fi

      - name: Install smoke-test dependencies
        working-directory: mootmaker-release-previous
        run: npm ci

      - name: Install Playwright browser
        working-directory: mootmaker-release-previous
        run: npx playwright install --with-deps chrome

      - name: Smoke test the rolled-back production
        working-directory: mootmaker-release-previous
        env:
          CI: 'true'
        run: |
          set -o pipefail
          ./smoke/run.sh production production 2>&1 | tee "$RUNNER_TEMP/smoke-rollback.log"

      # Playwright's JSON reporter output (Decision 9's `reporter: 'json'` under CI) - test names,
      # pass/fail, timing, error text. Never trace/video/screenshot: those are binary, run to
      # hundreds of MB, and PutLogEvents caps one event at 256KB regardless. A failed smoke test
      # needing a screenshot is an Actions artifact, a separate mechanism entirely.
      - name: Ship smoke-test-rollback output to CloudWatch
        if: always()
        run: |
          mootmaker-release/scripts/ship-to-cloudwatch.sh \
            "${{ needs.compute-version.outputs.previous }}" \
            smoke-test-rollback mootmaker-release production "${{ job.status }}" \
            "$RUNNER_TEMP/smoke-rollback.log"


  # The same read-only flow against production. A failure here does NOT roll production back: the
  # web smoke test decides that, and the API and webapp may be fine. It does stop the APK being
  # published, because record-outcome publishes only when every stage passed.
  smoke-android-production:
    name: smoke-android-production
    needs: [compute-version, build-android, deploy-production]
    uses: geoffweatherall/mootmaker-android/.github/workflows/smoke.yml@main
    with:
      artifact-name: ${{ needs.build-android.outputs.artifact-name }}
      environment: production
      ref: ${{ needs.compute-version.outputs.android-sha }}

  record-outcome:
    name: record-outcome
    needs: [compute-version, build-api, build-webapp, build-demo-data, build-android, tag, deploy-test, smoke-test-test, smoke-android-test, deploy-production, smoke-test-production, smoke-android-production, rollback-production, smoke-test-rollback]
    # if: always() is the whole mechanism. A normal job stops when something upstream fails; this
    # one must run regardless, or a failed release leaves tags on GitHub with nothing saying so.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Decision 5's third case opens an ISSUE when no tag was ever pushed, and that needs
      # issues:write - contents:write is not enough. The first release exercised only the
      # tagged-then-failed case, so this gap stayed hidden until a run failed before tagging and
      # record-outcome itself died with "Resource not accessible by integration (createIssue)".
      issues: write
    steps:
      # The APK build-android signed and the smoke jobs tested, attached to the Release only on
      # success. Absent when build-android failed, which the success branch below never reaches.
      - uses: actions/download-artifact@v4
        if: needs.build-android.result == 'success'
        with:
          name: ${{ needs.build-android.outputs.artifact-name }}
          path: apk

      - name: Publish the release record
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute-version.outputs.version }}
          # Deliberately the tag job's OWN output, not needs.tag.result. A run can fail after
          # tagging for reasons unrelated to whether the tags are real (Decision 5).
          TAG_PUSHED: ${{ needs.tag.outputs.pushed }}
          BUMP: ${{ inputs.bump }}
          API_SHA: ${{ needs.compute-version.outputs.api-sha }}
          WEBAPP_SHA: ${{ needs.compute-version.outputs.webapp-sha }}
          DEMO_DATA_SHA: ${{ needs.compute-version.outputs.demo-data-sha }}
          ANDROID_SHA: ${{ needs.compute-version.outputs.android-sha }}
          BUILD_API: ${{ needs.build-api.result }}
          BUILD_WEBAPP: ${{ needs.build-webapp.result }}
          BUILD_DEMO_DATA: ${{ needs.build-demo-data.result }}
          BUILD_ANDROID: ${{ needs.build-android.result }}
          SMOKE_ANDROID_TEST: ${{ needs.smoke-android-test.result }}
          SMOKE_ANDROID_PROD: ${{ needs.smoke-android-production.result }}
          DEPLOY_TEST: ${{ needs.deploy-test.result }}
          SMOKE_TEST: ${{ needs.smoke-test-test.result }}
          DEPLOY_PROD: ${{ needs.deploy-production.result }}
          SMOKE_PROD: ${{ needs.smoke-test-production.result }}
          ROLLBACK: ${{ needs.rollback-production.result }}
          SMOKE_ROLLBACK: ${{ needs.smoke-test-rollback.result }}
          PREVIOUS: ${{ needs.compute-version.outputs.previous }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "Bump: \`${BUMP}\`"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| build+acceptance mootmaker-api | ${BUILD_API} |"
            echo "| build+acceptance mootmaker-webapp | ${BUILD_WEBAPP} |"
            echo "| build+acceptance mootmaker-demo-data | ${BUILD_DEMO_DATA} |"
            echo "| build+acceptance mootmaker-android | ${BUILD_ANDROID} |"
            echo "| deploy-to-test | ${DEPLOY_TEST} |"
            echo "| smoke-test-test | ${SMOKE_TEST} |"
            echo "| smoke-android-test | ${SMOKE_ANDROID_TEST} |"
            echo "| deploy-to-production | ${DEPLOY_PROD} |"
            echo "| smoke-test-production | ${SMOKE_PROD} |"
            echo "| smoke-android-production | ${SMOKE_ANDROID_PROD} |"
            echo

            # A rollback is never left implicit in the record. OQ-2 accepted that an automatic
            # revert can mask a data-shape problem old code does not fix - the mitigation is that
            # it is always stated here, so the masking is never silent. Only a rollback that ran
            # is reported as one: cancelling a run marks every job "cancelled", which must not read
            # as a production rollback that never happened (mootmaker-release#36).
            if [ "${ROLLBACK}" = "success" ]; then
              echo "> **Production was rolled back to \`${PREVIOUS}\`.**"
              echo ">"
              echo "> The production smoke test failed on this version, so the previous release was"
              echo "> redeployed automatically (Decision 10)."
              echo "> Smoke test after rollback: \`${SMOKE_ROLLBACK}\`."
              echo ">"
              echo "> A rollback restores known-good code. It does NOT prove the underlying problem"
              echo "> is fixed - if the cause was environment- or data-shaped, it is still there."
              echo
            elif [ "${ROLLBACK}" = "failure" ]; then
              echo "> **The automatic rollback to \`${PREVIOUS}\` failed.**"
              echo ">"
              echo "> The production smoke test failed on this version and the rollback did not"
              echo "> complete, so production may be running this version or a partial deploy."
              echo "> Check it."
              echo
            elif [ "${ROLLBACK}" = "cancelled" ] && [ "${SMOKE_PROD}" = "failure" ]; then
              echo "> **The automatic rollback was cancelled before it finished.**"
              echo ">"
              echo "> The production smoke test failed on this version, so production is probably"
              echo "> still running it. Check it."
              echo
            fi
            echo "| Component | Commit |"
            echo "|---|---|"
            echo "| mootmaker-api | \`${API_SHA}\` |"
            echo "| mootmaker-webapp | \`${WEBAPP_SHA}\` |"
            echo "| mootmaker-demo-data | \`${DEMO_DATA_SHA}\` |"
            echo "| mootmaker-android | \`${ANDROID_SHA}\` |"
            echo
            echo "[Actions run](${run_url})"
          } > body.md

          # Three cases, exactly as Decision 5 sets out. The distinction that matters is whether a
          # version number was ever claimed by a tag: if it was, the record has to be a Release
          # naming it, so the tag is never orphaned. If it was not, there is no version to record
          # and an issue is the honest artifact.
          if [ "${TAG_PUSHED}" = "true" ] && [ "${BUILD_API}" = "success" ] \
             && [ "${BUILD_WEBAPP}" = "success" ] && [ "${BUILD_DEMO_DATA}" = "success" ] \
             && [ "${BUILD_ANDROID}" = "success" ] \
             && [ "${DEPLOY_TEST}" = "success" ] && [ "${SMOKE_TEST}" = "success" ] \
             && [ "${SMOKE_ANDROID_TEST}" = "success" ] \
             && [ "${DEPLOY_PROD}" = "success" ] && [ "${SMOKE_PROD}" = "success" ] \
             && [ "${SMOKE_ANDROID_PROD}" = "success" ]; then
            # The Android app is a preview until it reaches parity with the webapp (android-app.md).
            apk="apk/mootmaker-android-${VERSION}.apk"
            {
              echo
              echo "**Android app (preview):** \`mootmaker-android-${VERSION}.apk\`, SHA-256 in the \`.sha256\` file beside it."
            } >> body.md
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION}" --notes-file body.md \
              "${apk}#mootmaker-android-${VERSION}.apk (preview)" "${apk}.sha256"
            echo "Published release v${VERSION}"
          elif [ "${TAG_PUSHED}" = "true" ]; then
            gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION} (FAILED)" --notes-file body.md --prerelease
            echo "Published FAILED release record for v${VERSION}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Release attempt failed before tagging" --body-file body.md
            echo "No tags were pushed; opened an issue instead"
          fi
